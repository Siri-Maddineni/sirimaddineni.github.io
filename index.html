<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | Siri Maddineni</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #faf9f9;
      color: #111;
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.6;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }
    nav {
      display: flex;
      gap: 28px;
      padding: 28px 0;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    nav a {
      color: #111;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    nav .current { font-weight: 500; }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(56px, 10vw, 128px);
      line-height: 1;
      text-align: center;
      margin: 40px 0 12px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 40px;
    }

    .hero {
      position: relative;
      height: 760px;
    }
    .hero::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 70%;
      width: 60%;
      margin: 0 auto;
      background: #d9d9d9;
    }
    .hero .photo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      width: 62%;
      height: 100%;
      background: #222;
      overflow: hidden;
    }
    .hero .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .card {
      position: absolute;
      right: 0;
      top: 30%;
      width: 38%;
      background: #fff;
      padding: 40px 36px;
      box-shadow: 0 0 0 1px #eee;
    }
    .card h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: 30px;
      line-height: 1.2;
      margin: 0 0 16px;
    }
    .card p {
      font-size: 15px;
      margin: 0 0 24px;
    }
    .button {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid #111;
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }
    .button:hover { background: #111; color: #fff; }

    @media (max-width: 760px) {
      nav { flex-wrap: wrap; gap: 16px; }
      .hero { height: auto; display: flex; flex-direction: column; gap: 24px; }
      .hero::before { display: none; }
      .hero .photo { position: relative; width: 100%; height: 420px; left: 0; transform: none; }
      .card { position: relative; top: auto; right: auto; width: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="current" href="index.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>

    <h1>Hi, I'm Siri</h1>
    <p class="subtitle">CS student · DSATM, Bangalore</p>

    <div class="hero">
      <div class="photo">
        <img src="photo.jpg" alt="Siri Maddineni">
      </div>

      <div class="card">
        <h2>[One line in your own words about who you are.]</h2>
        <p>[Two or three sentences on what you're working on and what you're curious about. Plain and specific, the way you'd explain it to a professor.]</p>
        <a class="button" href="blog.html">Read the blog →</a>
      </div>
    </div>
  </div>
</body>
</html>
