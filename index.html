<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | Siri Maddineni</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #f7efec;
      color: #3a1f1f;
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1100px;
      height: 100vh;
      min-height: 620px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 20px 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    nav a {
      color: #3a1f1f;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    nav .current { font-weight: 500; }

    h1 {
      font-family: "Pinyon Script", cursive;
      font-weight: 400;
      font-size: clamp(44px, 6vw, 72px);
      line-height: 1.1;
      text-align: center;
      margin: 8px 0 16px;
    }

    .hero {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    .hero .photo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      height: 80%;
      width: 40%;
      background: #2a1a1a;
      overflow: hidden;
    }
    .hero .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .card {
      position: absolute;
      left: 62%;
      top: 38%;
      width: 20%;
      min-width: 200px;
      background: #fff;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 4px 16px rgba(58, 31, 31, 0.08);
    }
    .card h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 1.25;
      margin: 0 0 10px;
    }
    .card p {
      font-size: 13px;
      margin: 0 0 14px;
    }
    .button {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid #3a1f1f;
      color: #3a1f1f;
      text-decoration: none;
      font-size: 12px;
    }
    .button:hover { background: #3a1f1f; color: #fff; }

    @media (max-width: 760px) {
      .wrap { height: auto; min-height: 0; }
      .hero { flex: none; height: auto; display: flex; flex-direction: column; gap: 24px; }
      .hero .photo { position: relative; width: 100%; height: 380px; left: 0; transform: none; }
      .card { position: relative; left: auto; top: auto; width: auto; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="current" href="index.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>

    <h1>Siri Maddineni</h1>

    <div class="hero">
      <div class="photo">
        <img src="photo.jpg" alt="Siri Maddineni">
      </div>

      <div class="card">
        <h2>[One line in your own words about who you are.]</h2>
        <p>[Two or three sentences on what you're working on and what you're curious about.]</p>
        <a class="button" href="blog.html">Read the blog →</a>
      </div>
    </div>
  </div>
</body>
</html>
